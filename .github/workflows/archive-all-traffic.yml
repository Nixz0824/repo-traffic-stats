name: Archive All Traffic

on:
  schedule:
    # Daily at 06:00 UTC. GitHub schedules can lag; that's fine.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: archive-all-traffic
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and archive traffic for all repositories
        env:
          # A PAT with `repo` scope, stored as a repo secret named TRAFFIC_PAT.
          # The Actions-built-in GITHUB_TOKEN cannot read other repos' traffic.
          TRAFFIC_PAT: ${{ secrets.TRAFFIC_PAT }}
        run: python3 scripts/archive_all_traffic.py --all

      - name: Rebuild the interactive dashboard
        # Reads the just-written all-traffic.csv and renders index.html + dashboard.html.
        # Keeps everything in ONE data file; the dashboard is just a view.
        run: python3 scripts/render_dashboard.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add all-traffic.csv index.html dashboard.html
          if git diff --cached --quiet; then
            echo "No traffic change; nothing to commit."
          else
            git commit -m "chore: archive all-repo traffic + dashboard ($(date -u +%F))"
            git push
          fi
