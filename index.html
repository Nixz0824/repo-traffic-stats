<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>仓库流量看板</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#12161f; --panel2:#171c27; --panelline:#212836;
    --line:#1f2733; --txt:#e7edf5; --mut:#8b94a3; --dim:#5c6673;
    --acc:#4c9aff; --accsoft:rgba(76,154,255,.14); --ok:#3fb950; --warn:#d29922;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,'Segoe UI','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--acc);text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 60px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
  h1{font-size:22px;font-weight:700;letter-spacing:.2px;margin:0}
  .h1sub{color:var(--mut);font-size:12.5px;margin-top:4px}
  .meta{text-align:right;color:var(--mut);font-size:12px}
  .meta b{color:var(--txt);font-weight:600}
  #refreshBtn{margin-top:6px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;transition:.12s}
  #refreshBtn:hover{background:var(--acc);color:#0a0e16}
  #refreshBtn:disabled{opacity:.5;cursor:default}
  #refreshStatus{color:var(--mut);font-size:11.5px}

  .filters{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;
    background:linear-gradient(var(--bg) 78%,transparent);padding:10px 0 14px;margin-bottom:14px;backdrop-filter:blur(2px)}
  .f{display:flex;flex-direction:column;gap:6px}
  .f>.k{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--mut);padding:7px 14px;font-size:12.5px;cursor:pointer;transition:.12s}
  .seg button:hover{color:var(--txt)}
  .seg button.on{background:var(--acc);color:#0a0e16;font-weight:600}
  select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:7px 12px;border-radius:9px;font-size:12.5px}

  .cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--panelline);border-radius:12px;padding:14px 15px}
  .card .k{color:var(--mut);font-size:11.5px;letter-spacing:.3px}
  .card .v{font-size:23px;font-weight:700;margin-top:5px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
  .card .s{color:var(--dim);font-size:11.5px;margin-top:3px}

  .grid{display:grid;grid-template-columns:1.65fr 1fr;gap:16px;margin-bottom:16px}
  .panel{background:var(--panel);border:1px solid var(--panelline);border-radius:12px;padding:18px 18px 12px}
  .panel h2{font-size:13px;font-weight:600;color:var(--mut);letter-spacing:.3px;margin:0 0 4px;text-transform:uppercase}
  .panel .h2cap{font-size:12px;color:var(--dim);margin-bottom:10px}
  svg{display:block;width:100%;overflow:visible}
  .gridline{stroke:#1b222d;stroke-width:1}
  .axisline{stroke:#2a3342;stroke-width:1}
  .xt{fill:var(--dim);font-size:10.5px}
  .yt{fill:var(--dim);font-size:10.5px}
  .area{fill:url(#ga)}
  .line{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .dot{fill:var(--acc);cursor:pointer}
  .bar{fill:var(--acc);rx:3}
  .ranklabel{fill:var(--mut);font-size:11.5px}
  .rankval{fill:var(--txt);font-size:11.5px;font-weight:600}

  .empty{color:var(--mut);padding:28px;text-align:center;font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  th{color:var(--dim);font-weight:600;cursor:pointer;user-select:none;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px}
  th:first-child,td:first-child{text-align:left}
  th:hover{color:var(--txt)}
  tbody tr:hover{background:var(--panel2)}
  .foot{color:var(--dim);font-size:12px;margin-top:14px;line-height:1.7}

  @media(max-width:960px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>仓库流量看板</h1>
      <div class="h1sub">Views · Unique · Clones · Cloners</div>
    </div>
    <div class="meta">数据源 <b>all-traffic.csv</b> · 每仓库每天一行<br>
      <button id="refreshBtn" onclick="refreshData()">⟳ 更新数据</button><span id="refreshStatus"></span>
    </div>
  </div>

  <div class="filters">
    <div class="f"><span class="k">类别</span><div class="seg" id="segMetric"></div></div>
    <div class="f"><span class="k">粒度</span><div class="seg" id="segGran"></div></div>
    <div class="f"><span class="k">仓库</span><select id="scope"></select></div>
    <div class="f"><span class="k">时间范围</span><select id="range"></select></div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="grid">
    <div class="panel">
      <h2>趋势</h2><div class="h2cap" id="trendCap"></div>
      <div id="trend"></div>
    </div>
    <div class="panel">
      <h2>仓库排名</h2><div class="h2cap" id="rankCap"></div>
      <div id="rank"></div>
    </div>
  </div>

  <div class="panel">
    <h2>明细</h2><div class="h2cap">点表头排序</div>
    <div id="table"></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

    '<path class="line" d="'+line+'"/>'+dots+
    '<line class="axisline" x1="'+Pl+'" y1="'+(H-Pb)+'" x2="'+(W-Pr)+'" y2="'+(H-Pb)+'"/>'+xt+'</svg>';
  if(!max){box.innerHTML+='<div class="empty" style="padding:8px">该范围内均为 0(近期低流量或无数据)</div>';}
}
function fmtNum(n){if(n>=10000)return (n/10000).toFixed(1)+'w';if(n>=1000)return (n/1000).toFixed(1)+'k';return String(n);}

function drawRank(rows){
  const box=el('rank');
  el('rankCap').textContent=fmtMetric(S.metric)+' · 按'+fmtMetric(S.metric)+'排序 · Top 15';
  if(S.scope!=='all'){box.innerHTML='<div class="empty">选择“全部仓库”查看排名</div>';return;}
  const by={};rows.forEach(r=>{by[r.repo]=(by[r.repo]||0)+(+r[MK[S.metric]]||0);});
  const arr=Object.keys(by).map(r=>({repo:r,value:by[r]})).sort((a,b)=>b.value-a.value).slice(0,15);
  if(!arr.length){box.innerHTML='<div class="empty">暂无数据</div>';return;}
  const max=arr[0].value||1,W=480,rowH=24;
  const H=arr.length*rowH+8;
  let bars='';arr.forEach((it,i)=>{const y=6+i*rowH;const bw=Math.max(3,(it.value/max)*(W-240));
    bars+='<rect class="bar" x="192" y="'+y+'" width="'+bw+'" height="14"/>'+
      '<text class="ranklabel" x="186" y="'+(y+11)+'" text-anchor="end">'+it.repo.replace('Nixz0824/','')+'</text>'+
      '<text class="rankval" x="'+(196+bw)+'" y="'+(y+11)+'">'+it.value+'</text>';});
  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'">'+bars+'</svg>';
}

function drawTable(rows){
  const box=el('table');
  if(!rows.length){box.innerHTML='<div class="empty">暂无数据</div>';return;}
  const map={};rows.forEach(r=>{const k=r.repo+'|'+key(r.date,S.gran);if(!map[k])map[k]={repo:r.repo,period:key(r.date,S.gran),views:0,uniques:0,clones:0,cloners:0};const o=map[k];o.views+=+r.views||0;o.uniques+=+r.uniques||0;o.clones+=+r.clones||0;o.cloners+=+r.cloners||0;});
  let arr=Object.values(map);
  arr.sort((a,b)=>sortRows(a,b,window._sc||'repo',-1));
  let h='<table><thead><tr><th data-c="repo">仓库</th><th data-c="period">日期</th><th data-c="views">浏览</th><th data-c="uniques">访客</th><th data-c="clones">克隆</th><th data-c="cloners">克隆者</th></tr></thead><tbody>';
  arr.forEach(o=>{h+='<tr><td>'+o.repo+'</td><td>'+o.period+'</td><td>'+o.views+'</td><td>'+o.uniques+'</td><td>'+o.clones+'</td><td>'+o.cloners+'</td></tr>';});
  h+='</tbody></table>';
  box.innerHTML=h;
}
let _sc='repo',_sd=1;
function sortRows(a,b,c,dir){if(c==='repo')return dir*(a.repo<b.repo?-1:a.repo>b.repo?1:0);if(c==='period')return dir*(a.period<b.period?-1:a.period>b.period?1:0);return dir*((+a[c]||0)-(+b[c]||0));}

function buildSeg(id,vals,cur,fn){const seg=el(id);seg.innerHTML=vals.map(v=>'<button data-v="'+v+'" class="'+(v===cur?'on':'')+'">'+fmtMetric(v)+'</button>').join('');seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;seg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(b.dataset.v);});}
function render(){const rows=filterRows();renderCards(rows);drawTrend(rows);drawRank(rows);drawTable(rows);el('foot').innerHTML='<strong>更新说明:</strong> 时间范围相对数据最新一天('+maxDate()+')计算,不受打开日期影响。数据来自 GitHub Traffic API,每天定时抓取并取历史最大值;官方仅保留最近14天,归档从启用日起累加。右上角「更新数据」会从公开仓库拉取最新 all-traffic.csv 并重建看板。';
}

function init(){
  buildSeg('segMetric',['views','uniques','clones','cloners'],S.metric,v=>{S.metric=v;render();});
  buildSeg('segGran',['day','week','month'],S.gran,v=>{S.gran=v;render();});
  const repos=[...new Set(DATA.map(r=>r.repo))].sort();
  const sc=el('scope');sc.innerHTML='<option value="all">全部仓库</option>'+repos.map(r=>'<option value="'+r+'">'+r+'</option>').join('');
  sc.value=S.scope;sc.addEventListener('change',()=>{S.scope=sc.value;render();});
  const rg=el('range');const opts=[[7,'近7天'],[14,'近14天'],[30,'近30天'],[90,'近90天'],[365,'近365天'],[0,'全部']];
  rg.innerHTML=opts.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('');rg.value=S.range;rg.addEventListener('change',()=>{S.range=+rg.value;render();});
  el('table').addEventListener('click',e=>{const th=e.target.closest('th');if(!th)return;const c=th.dataset.c;if(_sc===c){_sd*=-1;}else{_sc=c;_sd=1;}sortRowsInit();});
  render();
}
function sortRowsInit(){const t=el('table').querySelector('tbody');if(!t)return;const trs=[...t.querySelectorAll('tr')];const idx=['repo','period','views','uniques','clones','cloners'];trs.sort((a,b)=>{const c=_sc;const ai=idx.indexOf(c);const av=a.cells[ai].textContent,bv=b.cells[ai].textContent;const na=+av||0,nb=+bv||0;let cmp;if(c==='repo'||c==='period'){cmp=av<bv?-1:av>bv?1:0;}else{cmp=na-nb;}return cmp*_sd;});trs.forEach(x=>t.appendChild(x));}
async function refreshData(){
  const btn=el('refreshBtn'), st=el('refreshStatus');
  btn.disabled=true; btn.textContent='更新中…'; st.textContent='';
  try{
    const r=await fetch('https://api.github.com/repos/Nixz0824/repo-traffic-stats/contents/all-traffic.csv',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    DATA=parseCsv(atob(j.content.replace(/\s/g,'')));
    render();
    st.textContent=' · 已更新至 '+maxDate();
    btn.textContent='⟳ 更新数据';
  }catch(e){
    st.textContent=' · 更新失败('+e.message+')';
    btn.textContent='⟳ 更新数据';
  }finally{ btn.disabled=false; }
}
function parseCsv(txt){
  const lines=txt.trim().split(/\r?\n/); const rows=[];
  for(let i=1;i<lines.length;i++){ if(!lines[i].trim())continue; const c=lines[i].split(','); if(c.length<6)continue;
    rows.push({repo:c[0],date:c[1],views:+c[2]||0,uniques:+c[3]||0,clones:+c[4]||0,cloners:+c[5]||0}); }
  return rows;
}
window.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
